name: Publicar Simulado TVDE no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar build
        run: npm run build -- --base=/Simulado-e-Estudo-/

      - name: Copiar imagens das questões
        run: |
          mkdir -p dist/assets/questoes
          cp -R public/assets/questoes/. dist/assets/questoes/
          echo "Imagens publicadas:"
          find dist/assets/questoes -type f | wc -l

      - name: Verificar imagens das questões
        run: |
          echo "=== VERIFICAÇÃO DAS IMAGENS ==="
          TOTAL_REFERENCIADAS=$(grep -oE "/assets/questoes/[^\"']+" src/data/questions.ts | sort -u | wc -l)
          TOTAL_ENCONTRADAS=0
          TOTAL_AUSENTES=0
          echo "Imagens referenciadas nas questões: $TOTAL_REFERENCIADAS"
          echo ""
          grep -oE "/assets/questoes/[^\"']+" src/data/questions.ts | sort -u | while read -r IMG; do
            ARQUIVO="public${IMG}"
            if [ -f "$ARQUIVO" ]; then
              echo "OK: $IMG"
            else
              echo "AUSENTE: $IMG"
            fi
          done
          echo ""
          echo "=== ARQUIVOS NO DIST ==="
          find dist/assets/questoes -type f | sort | wc -l
          echo ""
          echo "=== TESTE IMAGEM_21 ==="
          if [ -f "dist/assets/questoes/imagem_21.jpg" ]; then
            ls -lh "dist/assets/questoes/imagem_21.jpg"
            file "dist/assets/questoes/imagem_21.jpg"
          else
            echo "ERRO: imagem_21.jpg NÃO ESTÁ NO DIST"
          fi

      - name: Preparar SPA
        run: cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
